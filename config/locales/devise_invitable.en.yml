en:
  devise:
    failure:
      invited: "You have a pending invitation, accept it to finish creating your account."
    invitations:
      send_instructions: "An invitation email has been sent to %{email}."
      invitation_token_invalid: "The invitation token provided is not valid!"
      updated: "Your account has been created. You are now signed in."
      updated_not_active: "Your password was set successfully."
      no_invitations_remaining: "No invitations remaining"
      invitation_removed: "Your invitation was removed."
      new:
        header: "Invite Collaborator to DigitalLearn"
        submit_button: "Send Invitation"
      edit:
        header: "Create Collaborator Account"
        submit_button: "Create Account"
    mailer:
      invitation_instructions:
        subject:
          default: "Invitation instructions"
          att: "Invitation: AT&T Tools and Resources for Trainers"
        hello: "Hello %{name_or_email},"
        someone_invited_you_html:
          default: |
            You have been invited to join the DigitalLearn Tools and Resources for Instructors as a collaborator. You can accept this invitation through the link below.
          att: |
            Thank you for your partnership in advancing digital literacy.

            You have been invited to join the <a href="https://att.training.digitallearn.org" target="_blank">AT&T Digital Literacy Tools and Resources for Trainers</a> site as a collaborator.

            Accepting this invitation will give you access to resources designed to help support digital literacy training and learning opportunities in your communities.

            To get started, please select the link below:
        accept: "Accept invitation"
        accept_until: "This invitation will expire %{due_date}."
        ignore:
          default: "If you don't want to accept the invitation, please ignore this email. Your account won't be created until you access the link above and set your password."
          att: "If you do not wish to participate at this time, no action is needed. Your account will not be created unless you accept the invitation and complete the account setup process."
  time:
    formats:
      devise:
        mailer:
          invitation_instructions:
            accept_until_format: "%B %d, %Y %I:%M %p"
